[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-natalie"
version = "0.1.12"
description = "Offline personal assistant MCP server — memory, tasks, contacts, and conventions stored locally in your Obsidian vault. Works with Claude Code, OpenCode, and any MCP-compatible agent."
keywords = ["mcp", "obsidian", "personal-assistant", "ai-agent", "memory", "claude-code", "opencode", "offline", "local-ai", "tasks"]
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Simon Garnier", email = "simon.garnier@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp[cli]>=1.0",
    "typer>=0.12",
    "fastembed>=0.4",
    "numpy>=1.24",
    "jinja2>=3.1",
    "python-frontmatter>=1.1",
    "tomli-w>=1.0",
    "watchdog>=4.0",
]

[project.scripts]
natalie = "natalie.cli:app"
natalie-server = "natalie.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["natalie"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["natalie.server", "natalie.cli"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["watchdog.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.bandit]
skips = ["B101"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "build>=1.0",
    "hypothesis>=6.155.1",
    "mypy>=2.1.0",
    "ruff>=0.15.15",
    "twine>=5.0",
]
