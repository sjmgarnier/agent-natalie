[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-natalie"
version = "0.1.0"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "mcp[cli]>=1.0",
    "typer>=0.12",
    "httpx>=0.27",
    "fastembed>=0.4",
    "jinja2>=3.1",
    "watchfiles>=0.22",
    "python-frontmatter>=1.1",
    "tomli-w>=1.0",
]

[project.scripts]
natalie = "natalie.cli:app"
natalie-server = "natalie.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["natalie"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["natalie.server", "natalie.cli"]
disallow_untyped_decorators = false

[tool.bandit]
skips = ["B101"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.155.1",
    "mypy>=2.1.0",
    "ruff>=0.15.15",
]
